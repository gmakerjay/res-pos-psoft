services:
  restaurantpos-server:
    build:
      context: ../..
      dockerfile: web_server/deploy_linux/Dockerfile
    container_name: restaurantpos-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - DatabaseProvider=Sqlite
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
